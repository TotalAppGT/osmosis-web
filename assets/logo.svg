<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 180" role="img" aria-label="Osmosis Premium">
  <defs>
    <radialGradient id="orb" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#f9a8d4"/>
      <stop offset=".3" stop-color="#c084fc"/>
      <stop offset=".55" stop-color="#6d28d9"/>
      <stop offset=".8" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#05070f"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d2160"/>
      <stop offset="1" stop-color="#07112f"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#e11d2e"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="0" flood-color="#020617" flood-opacity=".9"/>
    </filter>
  </defs>
  <rect x="104" y="22" width="496" height="136" rx="18" fill="url(#panel)" stroke="#e11d2e" stroke-width="7"/>
  <rect x="112" y="30" width="480" height="120" rx="12" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="1.5"/>
  <circle cx="88" cy="90" r="72" fill="url(#orb)" stroke="url(#ring)" stroke-width="4" filter="url(#glow)"/>
  <ellipse cx="70" cy="58" rx="30" ry="20" fill="rgba(255,255,255,.22)" filter="blur(2)"/>
  <circle cx="55" cy="70" r="3" fill="#fff" opacity=".9"/>
  <circle cx="108" cy="52" r="2" fill="#fde68a" opacity=".9"/>
  <circle cx="120" cy="108" r="2.5" fill="#f9a8d4" opacity=".8"/>
  <circle cx="62" cy="112" r="2" fill="#93c5fd" opacity=".7"/>
  <text x="150" y="108" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="86" font-weight="900" letter-spacing="-4" fill="#ffd21e" filter="url(#textShadow)">smosis</text>
  <rect x="388" y="116" width="178" height="36" rx="7" fill="#e11d2e" stroke="#fff" stroke-width="2.5"/>
  <text x="477" y="141" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="21" font-weight="900" letter-spacing="1" fill="#fff">PREMIUM</text>
  <text x="152" y="148" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.8" fill="#c7d2fe">EVENTOS · AUDIO · ILUMINACIÓN</text>
</svg>
